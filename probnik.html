// Ядро пробника ЕГЭ (профиль): проверка ответов и код результата. Без DOM.
// Работает в браузере (window.CoreEGE) и в Node (для тестов).
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CoreEGE = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const EPS = 1e-6;

  // Понимает: 0,5  -12  1/2  3√2  √(2/3)  ⁴√32  11π/6  2π  log_3 5  log_5(2)  arctg(1/3)  2^10
  // Неявное умножение: 3√2, 2π, 128(25-4√34)π/9.
  function normInput(s) {
    return String(s == null ? '' : s)
      .replace(/[−–—]/g, '-').replace(/,/g, '.').replace(/°/g, '').replace(/[×·]/g, '*').replace(/:/g, '/')
      .replace(/пи/gi, 'π').replace(/pi/gi, 'π')
      .replace(/sqrt/gi, '√').replace(/корень/gi, '√')
      .replace(/inf(inity)?/gi, '∞').replace(/бесконечность/gi, '∞')
      .replace(/\s+/g, ' ').trim();
  }
  function tokenize(s) {
    const t = [];
    let i = 0;

      if (c === 'π') { t.push({ k: 'num', v: Math.PI }); i++; continue; }
      if (c === 'e' && !/[a-zа-я]/i.test(s[i + 1] || '')) { t.push({ k: 'num', v: Math.E }); i++; continue; }

      const last = out[out.length - 1];
      if (last && (s.a < last.b - EPS || (near(s.a, last.b) && (last.rb || s.la)))) {
        if (s.b > last.b + EPS) { last.b = s.b; last.rb = s.rb; } else if (near(s.b, last.b)) last.rb = last.rb || s.rb;
        if (near(s.a, last.a)) last.la = last.la || s.la;
      } else out.push(Object.assign({}, s));
    }
    return out;
  }
  function sameIntervals(x, y) {
    if (x.length !== y.length) return false;
    return x.every((s, i) => near(s.a, y[i].a) && near(s.b, y[i].b) && s.la === y[i].la && s.rb === y[i].rb);
  }

  // given — ввод ученика, key — ключ из банка (колонка «Ключ автопроверки»), mode — вид ответа.
  // Возвращает {ok, empty, error}. error — ученик написал что-то нечитаемое (засчитывается как неверно, но мы покажем подсказку).
  function check(given, key, mode) {
    const g = normInput(given);
    if (g === '') return { ok: false, empty: true };
    try {
      if (mode === 'num') return { ok: near(evalExpr(g), evalExpr(key)) };
      if (mode === 'set' || mode === 'seq') {
        const a = parseList(g), b = parseList(key);
        if (a.length !== b.length) return { ok: false };
        if (mode === 'seq') return { ok: a.every((v, i) => near(v, b[i])) };
        const A = a.slice().sort((p, q) => p - q), B = b.slice().sort((p, q) => p - q);
        return { ok: A.every((v, i) => near(v, B[i])) };
      }
      if (mode === 'int') return { ok: sameIntervals(parseIntervals(g), parseIntervals(key)) };
      return { ok: false, live: true };
    } catch (e) { return { ok: false, error: e.message }; }
  }
  // Предпросмотр для поля ввода: что понял сайт (для живой отрисовки и подсказок)
  function preview(given, mode) {
    try {
      if (mode === 'num') return { ok: true, value: evalExpr(given) };
      if (mode === 'set' || mode === 'seq') return { ok: true, value: parseList(given) };
      if (mode === 'int') return { ok: true, value: parseIntervals(given) };
    } catch (e) { return { ok: false, error: e.message }; }
    return { ok: true };
  }

  // ================= 3. Код результата =================
  // Формат: E<версия>-<вариант><цель>-<состояния заданий><время><контроль>
  // Пример: E1-C72-3F9K2A7QXH5
  //  версия  — версия составов вариантов (меняем, если поменялись задания в вариантах);
  //  вариант — A…E; цель — желаемый балл 0–100 (как есть, цифрами);
  //  состояния — по каждому заданию 0 = не приступал, 1 = неверно, 2 = верно; упакованы в base-3 → base32;
  //  время  — затраченные минуты / 5 (одна буква, до 155 мин); контроль — проверка опечаток.
  const ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // без I L O U
  function b32(n, len) { let s = ''; for (let i = 0; i < len; i++) { s = ALPHABET[Number(n & 31n)] + s; n >>= 5n; } if (n > 0n) throw new Error('Переполнение'); return s; }
  function fromB32(s) { let n = 0n; for (const ch of s) { const k = ALPHABET.indexOf(ch); if (k < 0) throw new Error('Неверный символ в коде: ' + ch); n = (n << 5n) | BigInt(k); } return n; }
  function checkChar(str) { let sum = 0; for (let i = 0; i < str.length; i++) sum = (sum * 7 + str.charCodeAt(i)) % 32; return ALPHABET[sum]; }
  const stateLen = n => Math.max(1, Math.ceil(n * Math.log2(3) / 5 - 1e-9));
  function encode({ version, variant, goal, states, minutes }) {
    if (!/^[A-E]$/.test(variant)) throw new Error('Вариант A–E');
    goal = Math.max(0, Math.min(100, Math.round(goal)));
    let n = 0n;
    for (let i = states.length - 1; i >= 0; i--) n = n * 3n + BigInt(states[i]);
    const t = ALPHABET[Math.max(0, Math.min(31, Math.round((minutes || 0) / 5)))];
    const body = 'E' + version + '-' + variant + goal + '-' + b32(n, stateLen(states.length)) + t;
    return body + checkChar(body);
  }
  // nTasks(version, variant) — сколько заданий в этом варианте (из файла составов)
  function decode(code, nTasks) {
    const c = String(code).trim().toUpperCase().replace(/\s/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[–—−]/g, '-');
    const m = /^E(\d+)-([A-E])(\d{1,3})-([0-9A-Z]+)$/.exec(c);
    if (!m) throw new Error('Код не похож на код пробника ЕГЭ');
    if (checkChar(c.slice(0, -1)) !== c.slice(-1)) throw new Error('Код введён с ошибкой, проверьте символы');
    const version = Number(m[1]), variant = m[2], goal = Number(m[3]);
    const n = nTasks(version, variant);
    const tail = m[4].slice(0, -1);
    const L = stateLen(n);
    if (tail.length !== L + 1) throw new Error('Длина кода не совпадает с вариантом ' + variant);
    let x = fromB32(tail.slice(0, L));
    const states = [];
    for (let i = 0; i < n; i++) { states.push(Number(x % 3n)); x /= 3n; }
    const minutes = ALPHABET.indexOf(tail[L]) * 5;
    return { version, variant, goal, states, minutes };
  }

  return { evalExpr, parseList, parseIntervals, check, preview, encode, decode, normInput };
});

ите квадрат длины вектора $\\overrightarrow{AB}$.", "img": "ege_256716.svg", "key": "40", "mode": "num", "sec": 45, "lvl": 1}, "D2.1-2": {"num": 2, "sub": "2.1", "text": "Две стороны прямоугольника $ABCD$ равны 6 и 8. Найдите длину суммы векторов $\\overrightarrow{AB}$ и $\\overrightarrow{AD}$.", "img": "ege_256789.svg", "key": "10", "mode": "num", "sec": 45, "lvl": 1}, "D3.2-1": {"num": 3, "sub": "3.2", "text": "Два ребра прямоугольного параллелепипеда, выходящие из одной вершины, равны 1 и 2. Площадь поверхности параллелепипеда равна 16. Найдите его диагональ.", "img": "ege_113209.svg", "key": "3", "mode": "num", "sec": 75, "lvl": 2}, "D3.2-2": {"num": 3, "sub": "3.2", "text": "Объем прямоугольного параллелепипеда равен 24. Одно из его ребер равно 3. Найдите площадь грани параллелепипеда, перпендикулярной этому ребру.", "img": "ege_113349.svg", "key": "8", "mode": "num", "sec": 45, "lvl": 1}, "D4.1-1": {"num": 4, "sub": "4.1", "text": "На экзамен вынесено 60 вопросов, Андрей не выучил 3 из них. Найдите вероятность того, что ему попадется выученный вопрос.", "img": null, "key": "0,95", "mode": "num", "sec": 45, "lvl": 1}, "D4.1-2": {"num": 4, "sub": "4.1", "text": "Фабрика выпускает сумки. В среднем 8 сумок из 100 имеют скрытые дефекты. Найдите вероятность того, что купленная сумка окажется без дефектов.", "img": null, "key": "0,92", "mode": "num", "sec": 40, "lvl": 1}, "D5.1-1": {"num": 5, "sub": "5.1", "text": "Агрофирма закупает куриные яйца в двух домашних хозяйствах. 40% яиц из первого хозяйства — яйца высшей категории, а из второго хозяйства — 20% яиц высшей категории. Всего высшую категорию получает 35% яиц. Найдите вероятность того, что яйцо, купленное у этой агрофирмы, окажется из первого хозяйства.", "img": null, "key": "0,75", "mode": "num", "sec": 90, "lvl": 2}, "D5.1-2": {"num": 5, "sub": "5.1", "text": "Агрофирма закупает куриные яйца только в двух домашних хозяйствах. Известно, что 5% яиц из первого хозяйства — яйца высшей категории, а из второго хозяйства — 30% яиц высшей категории. В этой агрофирме 15% яиц высшей категории. Найдите вероятность того, что яйцо, купленное у этой агрофирмы, окажется из первого хозяйства.", "img": null, "key": "0,6", "mode": "num", "sec": 90, "lvl": 2}, "D6.1-1": {"num": 6, "sub": "6.1", "text": "Организаторы лотереи выпустили 10 000 билетов. Выигрыши распределены следующим образом: выигрыш 100 руб. — 500 билетов; 1000 руб. — 100 билетов; 5000 руб. — 50 билетов; 10 000 руб. — 10 билетов; 50 000 руб. — 1 билет. Найдите математическое ожидание величины «выигрыш на один билет». Ответ дайте в рублях.", "img": null, "key": "55", "mode": "num", "sec": 150, "lvl": 2}, "D6.1-2": {"num": 6, "sub": "6.1", "text": "В таблице показано распределение случайной величины $X$. Найдите математическое ожидание этой случайной величины. Значения $X$: $-4;\\ 0;\\ 1;\\ 3$. Вероятности: $0{,}2;\\ 0{,}1;\\ 0{,}4;\\ 0{,}3$.", "img": null, "key": "0,5", "mode": "num", "sec": 90, "lvl": 1}, "D7.5-1": {"num": 7, "sub": "7.5", "text": "Найдите корень уравнения $\\log_5(4+x)=2$.", "img": null, "key": "21", "mode": "num", "sec": 60, "lvl": 1}, "D7.5-2": {"num": 7, "sub": "7.5", "text": "Найдите корень уравнения $\\log_2(15+x)=\\log_2 3$.", "img": null, "key": "-12", "mode": "num", "sec": 60, "lvl": 1}, "D8.4-1": {"num": 8, "sub": "8.4", "text": "Найдите значение выражения $\\left((2x^3)^4-(x^2)^6\\right):(3x^{12})$.", "img": null, "key": "5", "mode": "num", "sec": 75, "lvl": 1}, "D8.4-2": {"num": 8, "sub": "8.4", "text": "Найдите значение выражения $\\frac{a^2b^{-6}}{(4a)^3b^{-2}}\\cdot\\frac{16}{a^{-1}b^{-4}}$.", "img": null, "key": "0,25", "mode": "num", "sec": 105, "lvl": 2}, "D9.3-1": {"num": 9, "sub": "9.3", "text": "На рисунке изображён график функции $y=f(x)$, определённой на интервале $(-6;8)$. Определите количество целых точек, в которых производная функции положительна.", "img": "ege_180804.svg", "key": "4", "mode": "num", "sec": 105, "lvl": 2}, "D9.3-2": {"num": 9, "sub": "9.3", "text": "На рисунке изображён график функции $y=f(x)$, определённой на интервале $(-2;12)$. Найдите сумму точек экстремума функции $f(x)$.", "img": "ege_110254.svg", "key": "44", "mode": "num", "sec": 105, "lvl": 2}, "D10.2-1": {"num": 10, "sub": "10.2", "text": "После дождя уровень воды в колодце может повыситься. Мальчик измеряет время $t$ падения небольших камешков в колодец и рассчитывает расстояние до воды по формуле $h=5t^2$, где $h$ — расстояние в метрах, $t$ — время падения в секундах. До дождя время падения камешков составляло 0,6 с. На сколько должен подняться уровень воды после дождя, чтобы измеряемое время изменилось на 0,2 с? Ответ выразите в метрах.", "img": null, "key": "1", "mode": "num", "sec": 90, "lvl": 1}, "D10.2-2": {"num": 10, "sub": "10.2", "text": "Зависимость объёма спроса $q$ (единиц в месяц) на продукцию предприятия-монополиста от цены $p$ (тыс. руб.) задаётся формулой $q=100-10p$. Выручка предприятия за месяц $r$ (в тыс. руб.) вычисляется по формуле $r(p)=q\\cdot p$. Определите наибольшую цену $p$, при которой месячная выручка $r(p)$ составит не менее 240 тыс. руб. Ответ приведите в тыс. руб.", "img": null, "key": "6", "mode": "num", "sec": 120, "lvl": 2}, "D11.1-1": {"num": 11, "sub": "11.1", "text": "В 2008 году в городском квартале проживало 40 000 человек. В 2009 году, в результате строительства новых домов, число жителей выросло на 8%, а в 2010 году на 9% по сравнению с 2009 годом. Сколько человек стало проживать в квартале в 2010 году?", "img": null, "key": "47088", "mode": "num", "sec": 90, "lvl": 1}, "D11.1-2": {"num": 11, "sub": "11.1", "text": "В понедельник акции компании подорожали на некоторое количество процентов, а во вторник подешевели на то же самое количество процентов. В результате они стали стоить на 4% дешевле, чем при открытии торгов в понедельник. На сколько процентов подорожали акции компании в понедельник?", "img": null, "key": "20", "mode": "num", "sec": 150, "lvl": 2}, "D12.2-1": {"num": 12, "sub": "12.2", "text": "На рисунке изображён график функции $f(x)=ax^2-4x+c$. Найдите $f(-3)$.", "img": "ege_91907.svg", "key": "26", "mode": "num", "sec": 150, "lvl": 2}, "D12.2-2": {"num": 12, "sub": "12.2", "text": "На рисунке изображён график функции $f(x)=ax^2+bx-6$. Найдите $f(-6)$.", "img": "ege_91859.svg", "key": "48", "mode": "num", "sec": 150, "lvl": 2}, "D1.5-1": {"num": 1, "sub": "1.5", "text": "Основания равнобедренной трапеции равны $43$ и $73$. Косинус острого угла трапеции равен $\\frac57$. Найдите боковую сторону.", "img": "ege_244864.svg", "key": "21", "mode": "num", "sec": 75, "lvl": 2}, "D3.7-1": {"num": 3, "sub": "3.7", "text": "В правильной треугольной пирамиде $SABC$ медианы основания $ABC$ пересекаются в точке $O$. Площадь треугольника $ABC$ равна 9; объем пирамиды равен 6. Найдите длину отрезка $OS$.", "img": "ege_111724.svg", "key": "2", "mode": "num", "sec": 60, "lvl": 1}, "D5.2-2": {"num": 5, "sub": "5.2", "text": "Телефон передаёт SMS-сообщение. В случае неудачи телефон делает следующую попытку. Вероятность того, что сообщение удастся передать без ошибок в каждой отдельной попытке, равна 0,4. Найдите вероятность того, что для передачи сообщения потребуется не больше двух попыток.", "img": null, "key": "0,64", "mode": "num", "sec": 75, "lvl": 2}, "D7.3-1": {"num": 7, "sub": "7.3", "text": "Найдите корень уравнения $\\sqrt{\\frac{6}{4x-54}}=\\frac17$.", "img": null, "key": "87", "mode": "num", "sec": 90, "lvl": 2}, "D8.7-1": {"num": 8, "sub": "8.7", "text": "Найдите значение выражения $\\log_3 1{,}8+\\log_3 5$.", "img": null, "key": "2", "mode": "num", "sec": 60, "lvl": 1}, "D9.2-1": {"num": 9, "sub": "9.2", "text": "На рисунке изображён график функции $y=f(x)$ и касательная к нему в точке с абсциссой $x_0$. Найдите значение производной функции $f(x)$ в точке $x_0$.", "img": "ege_109646.svg", "key": "2", "mode": "num", "sec": 75, "lvl": 1}, "D10.5-1": {"num": 10, "sub": "10.5", "text": "При адиабатическом процессе для идеального газа выполняется закон $pV^k=10^5$ Па·м⁵, где $p$ — давление газа в паскалях, $V$ — объём газа в кубических метрах, $k=\\frac53$. Найдите, какой объём $V$ (в куб. м) будет занимать газ при давлении $p$, равном $3{,}2\\cdot10^6$ Па.", "img": null, "key": "0,125", "mode": "num", "sec": 120, "lvl": 2}, "D11.2-1": {"num": 11, "sub": "11.2", "text": "Из пункта A в пункт B одновременно выехали два автомобиля. Первый проехал с постоянной скоростью весь путь. Второй проехал первую половину пути со скоростью 24 км/ч, а вторую половину пути — со скоростью, на 16 км/ч большей скорости первого, в результате чего прибыл в пункт B одновременно с первым автомобилем. Найдите скорость первого автомобиля. Ответ дайте в км/ч.", "img": null, "key": "32", "mode": "num", "sec": 210, "lvl": 2}, "D12.5-1": {"num": 12, "sub": "12.5", "text": "На рисунке изображён график функции $f(x)=\\log_a(x+b)$. Найдите $f(11)$.", "img": "ege_91928.svg", "key": "4", "mode": "num", "sec": 120, "lvl": 2}, "D13.1-1": {"num": 13, "sub": "13.1", "text": "В 2026 году был открыт вклад на сумму 120 миллионов рублей, срок — 3 года. В конце каждого года банк увеличивает размер вклада на 15%. Кроме того, в начале каждого года, начиная со второго, вклад пополняется на 10 миллионов рублей. Определите сумму, которая будет находиться на вкладе к концу третьего года размещения денежных средств. Ответ дайте в миллионах рублей.", "img": null, "key": "207,23", "mode": "num", "sec": 240, "lvl": 2}, "D13.2-1": {"num": 13, "sub": "13.2", "text": "15-го января был выдан полугодовой кредит на развитие бизнеса. В таблице представлен график его погашения.\n$$\\begin{array}{|c|c|c|c|c|c|c|c|}\\hline \\text{Дата}&15.01&15.02&15.03&15.04&15.05&15.06&15.07\\\\\\hline \\text{Долг, \\% от кредита}&100\\%&90\\%&80\\%&70\\%&60\\%&50\\%&0\\%\\\\\\hline\\end{array}$$\nВ конце каждого месяца, начиная с января, текущий долг увеличивался на 5%, а выплаты по погашению кредита происходили в первой половине каждого месяца, начиная с февраля. На сколько процентов общая сумма выплат при таких условиях больше суммы самого кредита?", "img": null, "key": "22,5", "mode": "num", "sec": 240, "lvl": 2}, "D14.5-1": {"num": 14, "sub": "14.5", "text": "а) Решите уравнение $\\cos2x=\\sin\\left(x+\\frac\\pi2\\right)$.\nб) Найдите корни этого уравнения, принадлежащие промежутку $[-2\\pi;-\\pi]$.", "img": null, "key": "-2π; -4π/3", "mode": "set", "sec": 600, "lvl": 2}, "D16.3-2": {"num": 16, "sub": "16.3", "text": "Решите неравенство $2^{x^2}\\le4\\cdot2^x$.", "img": null, "key": "[-1;2]", "mode": "int", "sec": 540, "lvl": 1}, "D1.3-2": {"num": 1, "sub": "1.3", "text": "В треугольнике $ABC$ угол $A$ равен $40^\\circ$, внешний угол при вершине $B$ равен $102^\\circ$. Найдите угол $C$. Ответ дайте в градусах.", "img": "ege_243540.svg", "key": "62", "mode": "num", "sec": 45, "lvl": 1}, "D1.9-2": {"num": 1, "sub": "1.9", "text": "Точки $A,B,C,D$, расположенные на окружности, делят её на четыре дуги $AB$, $BC$, $CD$ и $AD$, градусные величины которых относятся соответственно как $4:2:3:6$. Найдите угол $A$ четырехугольника $ABCD$. Ответ дайте в градусах.", "img": "ege_138531.svg", "key": "60", "mode": "num", "sec": 75, "lvl": 2}, "D3.6-1": {"num": 3, "sub": "3.6", "text": "В сосуд, имеющий форму правильной треугольной призмы, налили воду. Уровень воды достигает 80 см. На какой высоте будет находиться уровень воды, если ее перелить в другой такой же сосуд, у которого сторона основания в 4 раза больше, чем у первого? Ответ выразите в см.", "img": "ege_233799.svg", "key": "5", "mode": "num", "sec": 75, "lvl": 2}, "D3.10-1": {"num": 3, "sub": "3.10", "text": "Найдите объем $V$ конуса, образующая которого равна 2 и наклонена к плоскости основания под углом $30^\\circ$. В ответе укажите $\\frac{V}{\\pi}$.", "img": "ege_139998.svg", "key": "1", "mode": "num", "sec": 90, "lvl": 2}, "D7.6-1": {"num": 7, "sub": "7.6", "text": "Решите уравнение $\\operatorname{tg}\\frac{\\pi x}{4}=-1$. В ответе напишите наибольший отрицательный корень.", "img": null, "key": "-1", "mode": "num", "sec": 90, "lvl": 2}, "D8.6-1": {"num": 8, "sub": "8.6", "text": "Найдите значение выражения $\\frac{\\sqrt{m}}{\\sqrt[9]{m}\\cdot\\sqrt[18]{m}}$ при $m=64$.", "img": null, "key": "4", "mode": "num", "sec": 90, "lvl": 2}, "D8.9-1": {"num": 8, "sub": "8.9", "text": "Найдите $\\operatorname{tg}\\alpha$, если $\\cos\\alpha=\\frac{\\sqrt{10}}{10}$ и $\\alpha\\in\\left(\\frac{3\\pi}{2};2\\pi\\right)$.", "img": null, "key": "-3", "mode": "num", "sec": 105, "lvl": 2}, "D9.4-1": {"num": 9, "sub": "9.4", "text": "На рисунке изображён график некоторой функции $y=f(x)$ (два луча с общей начальной точкой). Пользуясь рисунком, вычислите $F(8)-F(2)$, где $F(x)$ — одна из первообразных функции $f(x)$.", "img": "ege_141014.svg", "key": "7", "mode": "num", "sec": 120, "lvl": 2}, "D10.6-1": {"num": 10, "sub": "10.6", "text": "Ёмкость высоковольтного конденсатора в телевизоре $C=2\\cdot10^{-6}$ Ф. Параллельно с конденсатором подключён резистор с сопротивлением $R=5\\cdot10^6$ Ом. Во время работы телевизора напряжение на конденсаторе $U_0=16$ кВ. После выключения телевизора напряжение на конденсаторе убывает до значения $U$ (кВ) за время, определяемое выражением $t=\\alpha RC\\log_2\\frac{U_0}{U}$ (с), где $\\alpha=0{,}7$ — постоянная. Определите напряжение на конденсаторе, если после выключения телевизора прошла 21 с. Ответ дайте в киловольтах.", "img": null, "key": "2", "mode": "num", "sec": 120, "lvl": 2}, "D11.4-1": {"num": 11, "sub": "11.4", "text": "Моторная лодка прошла против течения реки 112 км и вернулась в пункт отправления, затратив на обратный путь на 6 часов меньше. Найдите скорость течения, если скорость лодки в неподвижной воде равна 11 км/ч. Ответ дайте в км/ч.", "img": null, "key": "3", "mode": "num", "sec": 210, "lvl": 2}, "D11.5-2": {"num": 11, "sub": "11.5", "text": "На изготовление 475 деталей первый рабочий тратит на 6 часов меньше, чем второй рабочий на изготовление 550 таких же деталей. Известно, что первый рабочий за час делает на 3 детали больше, чем второй. Сколько деталей в час делает первый рабочий?", "img": null, "key": "25", "mode": "num", "sec": 240, "lvl": 2}, "D12.6-1": {"num": 12, "sub": "12.6", "text": "На рисунке изображён график функции $f(x)=a\\cos x+b$. Найдите $a$.", "img": "ege_97817.svg", "key": "1,5", "mode": "num", "sec": 120, "lvl": 2}, "D12.7-1": {"num": 12, "sub": "12.7", "text": "На рисунке изображены графики функций $f(x)=5x+9$ и $g(x)=ax^2+bx+c$, которые пересекаются в точках $A$ и $B$. Найдите абсциссу точки $B$.", "img": "ege_91974.svg", "key": "6", "mode": "num", "sec": 180, "lvl": 3}, "D14.1-1": {"num": 14, "sub": "14.1", "text": "а) Решите уравнение $9^{x-\\frac12}-8\\cdot3^{x-1}+5=0$.\nб) Найдите все корни этого уравнения, принадлежащие промежутку $\\left(1;\\frac73\\right)$.", "img": null, "key": "log_3 5", "mode": "set", "sec": 600, "lvl": 2}, "D16.5-1": {"num": 16, "sub": "16.5", "text": "Решите неравенство $\\log_2^2x+6>5\\log_2x$.", "img": null, "key": "(0;4)∪(8;+∞)", "mode": "int", "sec": 600, "lvl": 1}, "D17.1-2": {"num": 17, "sub": "17.1", "text": "Алексей вышел из дома на прогулку со скоростью $v$ км/ч. После того как он прошёл 6 км, из дома следом за ним выбежала собака Жучка, скорость которой была на 9 км/ч больше скорости Алексея. Когда Жучка догнала хозяина, они повернули назад и вместе возвратились домой со скоростью 4 км/ч. Найдите значение $v$, при котором время прогулки Алексея окажется наименьшим. Сколько при этом составит время его прогулки?", "img": null, "key": "6; 25/6", "mode": "seq", "sec": 900, "lvl": 2}, "D1.8-1": {"num": 1, "sub": "1.8", "text": "Площадь треугольника равна $24$, а радиус вписанной окружности равен $2$. Найдите периметр этого треугольника.", "img": "ege_251652.svg", "key": "24", "mode": "num", "sec": 60, "lvl": 2}, "D3.10-2": {"num": 3, "sub": "3.10", "text": "Высота конуса равна 6, образующая равна 10. Найдите его объем, деленный на $\\pi$.", "img": "ege_139999.svg", "key": "128", "mode": "num", "sec": 75, "lvl": 2}, "D5.2-1": {"num": 5, "sub": "5.2", "text": "В одном ресторане в г. Тамбове администратор предлагает гостям сыграть в «Шеш-беш»: гость бросает одновременно две игральные кости. Если он выбросит комбинацию 5 и 6 очков хотя бы один раз из двух попыток, то получит комплемент от ресторана: чашку кофе или десерт бесплатно. Какова вероятность получить комплемент? Результат округлите до сотых.", "img": null, "key": "0,11", "mode": "num", "sec": 120, "lvl": 2}, "D7.3-2": {"num": 7, "sub": "7.3", "text": "Найдите корень уравнения: $\\sqrt{-72-17x}=-x$. Если уравнение имеет более одного корня, укажите меньший из них.", "img": null, "key": "-9", "mode": "num", "sec": 120, "lvl": 2}, "D8.8-1": {"num": 8, "sub": "8.8", "text": "Найдите значение выражения $\\log_a(ab^3)$, если $\\log_b a=\\frac17$.", "img": null, "key": "22", "mode": "num", "sec": 90, "lvl": 2}, "D8.11-1": {"num": 8, "sub": "8.11", "text": "Найдите значение выражения $\\frac{3\\cos(\\pi-\\beta)+\\sin\\left(\\frac\\pi2+\\beta\\right)}{\\cos(\\beta+3\\pi)}$.", "img": null, "key": "2", "mode": "num", "sec": 105, "lvl": 2}, "D9.4-2": {"num": 9, "sub": "9.4", "text": "На рисунке изображён график функции $y=F(x)$ — одной из первообразных функции $f(x)$, определённой на интервале $(-3;5)$. Найдите количество решений уравнения $f(x)=0$ на отрезке $[-2;4]$.", "img": "ege_140989.svg", "key": "10", "mode": "num", "sec": 150, "lvl": 3}, "D10.4-2": {"num": 10, "sub": "10.4", "text": "При движении ракеты её видимая для неподвижного наблюдателя длина, измеряемая в метрах, сокращается по закону $l=l_0\\sqrt{1-\\frac{v^2}{c^2}}$, где $l_0=5$ м — длина покоящейся ракеты, $c=3\\cdot10^5$ км/с — скорость света, а $v$ — скорость ракеты (в км/с). Какова должна быть минимальная скорость ракеты, чтобы её наблюдаемая длина стала не более 4 м? Ответ выразите в км/с.", "img": null, "key": "180000", "mode": "num", "sec": 120, "lvl": 2}, "D12.5-2": {"num": 12, "sub": "12.5", "text": "На рисунке изображён график функции $f(x)=a^x+b$. Найдите $f(6)$.", "img": "ege_91922.svg", "key": "61", "mode": "num", "sec": 120, "lvl": 2}, "D13.1-2": {"num": 13, "sub": "13.1", "text": "В 2026 году был открыт вклад на сумму 100 тысяч рублей, срок — 4 года. В конце каждого года банк увеличивает размер вклада на 10%. Кроме того, в начале каждого года, начиная со второго, со вклада снимается 5 тысяч рублей. Определите сумму, которая будет находиться на вкладе к концу четвёртого года размещения денежных средств. Ответ дайте в рублях.", "img": null, "key": "128205", "mode": "num", "sec": 270, "lvl": 2}, "D13.2-2": {"num": 13, "sub": "13.2", "text": "В июле планируется взять кредит в банке на сумму 7 млн рублей на срок 10 лет. Условия возврата таковы:\n— каждый январь долг возрастает на $r\\%$ по сравнению с концом предыдущего года;\n— с февраля по июнь необходимо выплатить часть долга так, чтобы на начало июля каждого года долг уменьшался на одну и ту же сумму по сравнению с предыдущим июлем.\nНайдите наименьшую возможную ставку $r$, если известно, что последний платёж будет не менее 0,819 млн рублей.", "img": null, "key": "17", "mode": "num", "sec": 300, "lvl": 3}, "D14.8-1": {"num": 14, "sub": "14.8", "text": "а) Решите уравнение $(\\cos x-1)(\\operatorname{tg}x+\\sqrt3)\\sqrt{\\cos x}=0$.\nб) Найдите все корни этого уравнения, принадлежащие отрезку $\\left[3\\pi;\\frac{9\\pi}2\\right]$.", "img": null, "key": "11π/3; 4π", "mode": "set", "sec": 720, "lvl": 3}, "D16.7-2": {"num": 16, "sub": "16.7", "text": "Решите неравенство $\\frac{\\log_2(2x)\\cdot\\log_{0{,}5x}2}{\\log_{0{,}125x}8}\\le1$.", "img": null, "key": "(0;1]∪(2;8)∪(8;32]", "mode": "int", "sec": 1200, "lvl": 3}, "D17.1-1": {"num": 17, "sub": "17.1", "text": "Два велосипедиста равномерно движутся по взаимно перпендикулярным дорогам по направлению к перекрёстку этих дорог. Один из них движется со скоростью 40 км/ч и находится на расстоянии 5 км от перекрёстка, второй движется со скоростью 30 км/ч и находится на расстоянии 3 км от перекрёстка. Через сколько минут расстояние между велосипедистами станет наименьшим? Каково будет это наименьшее расстояние? Считайте, что перекрёсток не T-образный, обе дороги продолжаются за перекрёстком.", "img": null, "key": "6,96; 0,6", "mode": "seq", "sec": 900, "lvl": 2}, "D7.6-2": {"num": 7, "sub": "7.6", "text": "Решите уравнение $\\sin\\frac{\\pi x}{3}=0{,}5$. В ответе напишите наименьший положительный корень.", "img": null, "key": "0,5", "mode": "num", "sec": 90, "lvl": 2}, "D8.9-2": {"num": 8, "sub": "8.9", "text": "Найдите $3\\cos\\alpha$, если $\\sin\\alpha=-\\frac{2\\sqrt2}{3}$ и $\\alpha\\in\\left(\\frac{3\\pi}{2};2\\pi\\right)$.", "img": null, "key": "1", "mode": "num", "sec": 105, "lvl": 2}, "D8.11-2": {"num": 8, "sub": "8.11", "text": "Найдите значение выражения $\\frac{2\\sin(\\alpha-7\\pi)+\\cos\\left(\\frac{3\\pi}{2}+\\alpha\\right)}{\\sin(\\alpha+\\pi)}$.", "img": null, "key": "1", "mode": "num", "sec": 105, "lvl": 2}, "D10.8-2": {"num": 10, "sub": "10.8", "text": "Рейтинг $R$ интернет-магазина вычисляется по формуле $R=r_{\\text{пок}}-\\frac{r_{\\text{пок}}-r_{\\text{экс}}}{(K+1)^m}$, где $m=\\frac{0{,}02K}{r_{\\text{пок}}+0{,}1}$, $r_{\\text{экс}}$ — средняя оценка, данная экспертами, $r_{\\text{пок}}$ — средняя оценка, данная покупателями, $K$ — число покупателей, оценивших магазин. Найдите рейтинг интернет-магазина, если число покупателей, оценивших магазин, равно 24, их средняя оценка равна 0,86, а оценка экспертов равна 0,11.", "img": null, "key": "0,71", "mode": "num", "sec": 150, "lvl": 3}, "D11.4-2": {"num": 11, "sub": "11.4", "text": "Моторная лодка в 10:00 вышла из пункта А в пункт В, расположенный в 30 км от А. Пробыв в пункте В 2 часа 30 минут, лодка отправилась назад и вернулась в пункт А в 18:00 того же дня. Определите (в км/ч) собственную скорость лодки, если известно, что скорость течения реки 1 км/ч.", "img": null, "key": "11", "mode": "num", "sec": 240, "lvl": 2}, "D12.7-2": {"num": 12, "sub": "12.7", "text": "На рисунке изображены графики функций $f(x)=\\dfrac kx$ и $g(x)=ax+b$, которые пересекаются в точках $A$ и $B$. Найдите абсциссу точки $B$.", "img": "ege_149707.svg", "key": "-0,2", "mode": "num", "sec": 180, "lvl": 3}, "D14.13-2": {"num": 14, "sub": "14.13", "text": "а) Решите уравнение $\\frac{16^{\\sin x}-3\\cdot4^{\\frac12+\\sin x}+8}{\\log_2(1-3\\cos x)}=0$.\nб) Укажите корни этого уравнения, принадлежащие отрезку $\\left[-\\frac{3\\pi}4;\\frac{6\\pi}5\\right]$.", "img": null, "key": "5π/6", "mode": "set", "sec": 840, "lvl": 3}, "D16.15-1": {"num": 16, "sub": "16.15", "text": "Решите неравенство $|6-7^x|\\le(7^x-6)\\log_6(x+1)$.", "img": null, "key": "(-1;-5/6]∪{log_7 6}∪[5;+∞)", "mode": "int", "sec": 1200, "lvl": 3}, "D19.1-1": {"num": 19, "sub": "19.1", "text": "Найдите наименьшее натуральное значение $a$, при котором расстояние между наибольшим и наименьшим корнями уравнения $(x-a+4)(x^2-ax+4a-17)=0$ не меньше 9.", "img": null, "key": "17", "mode": "num", "sec": 900, "lvl": 3}}, "imgs": {"ege_144915.svg": "data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4NCjwhLS0gR2VuZXJhdG9yOiBBZG9iZSBJbGx1c3RyYXRvciAyNy4yLjAsIFNWRyBFeHBvcnQgUGx1Zy1JbiAuIFNWRyBWZXJzaW9uOiA2LjAwIEJ1aWxkIDApICAtLT4NCjxzdmcgdmVyc2lvbj0iMS4xIiBpZD0i0KHQu9C+0LlfMSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB4bWxuczp4bGluaz0iaHR0cDovL3d3dy53My5vcmcvMTk5OS94bGluayIgeD0iMHB4IiB5PSIwcHgiDQoJIHdpZHRoPSIxNTAuODA2cHgiIGhlaWdodD0iODcuNDQ4OHB4IiB2aWV3Qm94PSIwIDAgMTUwLjgwNiA4Ny40NDg4IiBlbmFibGUtYmFja2dyb3VuZD0ibmV3IDAgMCAxNTAuODA2IDg3LjQ0ODgiDQoJIHhtbDpzcGFjZT0icHJlc2VydmUiPg0KPHBhdGggZmlsbD0ibm9uZSIgc3Ryb2tlPSIjQ0M3NjFGIiBzdHJva2Utd2lkdGg9IjAuNzUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgc3Ryb2tlLW1pdGVybGltaXQ9IjEwIiBkPSINCglNMjkuMzM0Myw3Mi4xNzg4YzAsMCwyLjIyNi0yLjE4LDEuNzAzLTQuOTI4Yy0wLjUyMS0yLjc0OS0zLjEwNC0zLjg4LTMuMTA0LTMuODgiLz4NCjxnPg0KCQ0KCQk8bGluZSBmaWxsPSJub25lIiBzdHJva2U9IiNDQzc2MUYiIHN0cm9rZS13aWR0aD0iMC43NSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2UtbWl0ZXJsaW1pdD0iMTAiIHgxPSIxMDcuNjQyMyIgeTE9IjIz     let armed = false;
    document.getElementById('finish').onclick = () => {
      const empty = inputs.filter(x => !x.value.trim()).length;
      if (empty && !armed) { armed = true; document.getElementById('finish').textContent = `Пустых ответов: ${empty}. Нажми ещё раз, чтобы завершить`; return; }
      clearInterval(tick); showKb(false);
      result(v, ids, inputs.map(x => x.value), Math.round((Date.now() - t0) / 60000));
    };
    scrollTo(0, 0);
  }
  const pvTimers = {};
  function live(inp, ids) {
    const i = +inp.dataset.i, t = DATA.tasks[ids[i]], box = document.getElementById('p' + i);
    document.querySelector(`#dots a[data-i="${i}"]`).classList.toggle('filled', !!inp.value.trim());
    clearTimeout(pvTimers[i]);
    pvTimers[i] = setTimeout(() => {
      const v = inp.value.trim();
      if (!v) { box.textContent = ''; box.className = 'pv'; return; }
      const r = CoreEGE.preview(v, t.mode);
      if (!r.ok) { box.className = 'pv err'; box.textContent = 'Пока не читается: ' + r.error; return; }
      box.className = 'pv';
      const n = Array.isArray(r.value) ? (t.mode === 'int' ? '' : ` <span class="muted">· чисел: ${r.value.length}</span>`) : '';
      box.innerHTML = '$' + toTex(v) + '$' + n;
      typeset(box);
    }, 250);
  }

  // ---------- клавиатура символов ----------
  // Набор клавиш зависит от вида ответа: на телефоне место дорогое, лишнего не показываем.
  const K = { '(': '(', ')': ')', '[': '[', ']': ']', '{': '{', '}': '}', '∪': '∪', ';': '; ', ',': ',', '−∞': '-∞', '+∞': '+∞', '∅': '∅', 'π': 'π', '√': '√', '/': '/', 'log': 'log_', '°': '°', '−': '-', '⌫': null };
  const LAYOUT = {
    num: { cols: 8, keys: ['−', ',', '/', '√', 'π', '(', ')', 'log', '°', '⌫'] },
    seq: { cols: 8, keys: [';', '−', ',', '/', '√', 'π', '(', ')', 'log', '⌫'] },
    set: { cols: 8, keys: [';', '−', '/', 'π', '√', '(', ')', ',', 'log', '⌫'] },
    int: { cols: 9, keys: ['(', ')', '[', ']', '{', '}', '∪', ';', ',', '−∞', '+∞', '∅', '−', '/', '√', 'π', 'log', '⌫'] }
  };
  const TITLE = { num: 'Символы для числа', seq: 'Символы: два числа через ;', set: 'Символы: корни через ;', int: 'Символы для промежутков' };
  let kbOff = false; try { kbOff = localStorage.getItem('egeKbOff') === '1'; } catch (e) {}
  const kb = document.getElementById('kb'), pill = document.getElementById('kbPill'), keysEl = document.getElementById('keys');
  function layoutFor(mode) {
    const L = LAYOUT[mode] || LAYOUT.num;
    keysEl.style.setProperty('--cols', L.cols);
    const used = L.keys.length, pad = (L.cols - used % L.cols) % L.cols; // последняя клавиша ⌫ растягивается, чтобы ряд был полным
    keysEl.innerHTML = L.keys.map((k, i) => `<button type="button" data-k="${esc(k)}" class="${k === '⌫' ? 'del' : ''}" aria-label="${k === '⌫' ? 'Стереть символ' : 'Вставить ' + esc(k)}">${esc(k)}</button>`).join('');
    if (pad > 0) keysEl.lastElementChild.style.gridColumn = `span ${pad + 1}`;
    document.getElementById('kbTitle').textContent = TITLE[mode] || TITLE.num;
  }
  function placeAboveSystemKb() {
    // iPhone: системная клавиатура не сдвигает fixed-элементы — поднимаем панель сами
    const vv = window.visualViewport; if (!vv) return;
    const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    kb.style.bottom = off + 'px'; pill.style.bottom = `calc(${off + 12}px + env(safe-area-inset-bottom,0px))`;
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', placeAboveSystemKb); visualViewport.addEventListener('scroll', placeAboveSystemKb); }
  function showKb(on) {
    if (on && active) layoutFor(active.dataset.mode);
    kb.hidden = !on || kbOff; pill.hidden = !on || !kbOff;
    document.body.style.paddingBottom = (!kb.hidden ? kb.offsetHeight + 40 : 120) + 'px';
    placeAboveSystemKb();
  }
  document.getElementById('kbHide').onclick = () => { kbOff = true; try { localStorage.setItem('egeKbOff', '1'); } catch (e) {} showKb(true); if (active) active.focus(); };
  pill.onclick = () => { kbOff = false; try { localStorage.setItem('egeKbOff', '0'); } catch (e) {} showKb(true); if (active) active.focus(); };
  document.getElementById('kbAbc').onclick = () => {
    // на случай, если нужны буквы (arctg и т.п.): переключаем системную клавиатуру
    if (!active) return; const abc = active.inputMode !== 'text';
    active.inputMode = abc ? 'text' : 'decimal'; document.getElementById('kbAbc').textContent = abc ? '123' : 'абв';
    active.blur(); setTimeout(() => active.focus(), 30);
  };
  [kb, pill].forEach(el => el.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); }));
  keysEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !active) return;
    const ins = K[b.dataset.k];
    const s = active.selectionStart ?? active.value.length, en = active.selectionEnd ?? s;
    if (ins === null) { const a = s === en ? Math.max(0, s - 1) : s; active.value = active.value.slice(0, a) + active.value.slice(en); active.setSelectionRange(a, a); }
    else { active.value = active.value.slice(0, s) + ins + active.value.slice(en); const c = s + ins.length; active.setSelectionRange(c, c); }
    active.focus(); active.dispatchEvent(new Event('input'));
  });

  // ---------- результат ----------
  function result(v, ids, given, minutes) {
    const res = ids.map((id, i) => { const t = DATA.tasks[id]; const r = CoreEGE.check(given[i], t.key, t.mode); return r.empty ? 0 : r.ok ? 2 : 1; });
    const code = CoreEGE.encode({ version: DATA.version, variant: v, goal: S.goal, states: res, minutes });
    const ok = res.filter(x => x === 2).length, skip = res.filter(x => x === 0).length;
    const LBL = ['<span class="st skip">пропуск</span>', '<span class="st bad">неверно</span>', '<span class="st ok">верно</span>'];
    app.innerHTML = `<h1>Готово</h1>
      <p><span class="score">${ok} из ${ids.length}</span></p>
      <p class="muted">Вариант ${v} · цель ${S.goal} баллов · ${minutes} мин${minutes > DATA.variants[v].limit ? ' (больше нормы)' : ''} · пропущено ${skip}</p>
      <h2>Код результата</h2>
      <p>Отправь этот код репетитору — по нему он увидит, что получилось, и соберёт твой маршрут.</p>
      <span class="code" id="codeBox">${code}</span>
      <div class="row" style="margin-top:10px"><button class="primary" id="copy">Скопировать код</button><button id="again">Пройти заново</button></div>
      <h2>По заданиям</h2>
      <div class="tw"><table><thead><tr><th>#</th><th>№ ЕГЭ</th><th>Твой ответ</th><th>Итог</th></tr></thead><tbody>
      ${ids.map((id, i) => `<tr><td>${i + 1}</td><td>${DATA.tasks[id].num}</td><td style="font-family:var(--mono)">${esc(given[i] || '—')}</td><td>${LBL[res[i]]}</td></tr>`).join('')}
      </tbody></table></div>
      <h2>Проверка кода</h2>
      <p class="muted">Так репетитор прочитает код: ${(() => { try { const d = CoreEGE.decode(code, (ver, x) => DATA.variants[x].ids.length); return `вариант ${d.variant}, цель ${d.goal}, ${d.minutes} мин, верно ${d.states.filter(x => x === 2).length}, неверно ${d.states.filter(x => x === 1).length}, пропусков ${d.states.filter(x => x === 0).length}`; } catch (e) { return 'ошибка: ' + e.message; } })()}</p>`;
    document.getElementById('copy').onclick = e => {
      const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('codeBox')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Выделено — скопируй'; };
      try { navigator.clipboard.writeText(code).then(() => { e.target.textContent = 'Скопировано'; }, sel); } catch (err) { sel(); }
    };
    document.getElementById('again').onclick = start;
    scrollTo(0, 0);
  }
  start();
})();
</script>
